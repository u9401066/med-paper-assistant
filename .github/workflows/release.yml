name: Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags: v0.3.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (for example: 0.7.11)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────
  # 1. Validate tag version matches source files
  # ──────────────────────────────────────────────────────
  validate:
    name: Validate release authority
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION="${DISPATCH_VERSION#v}"
          fi
          if ! python - "$TAG_VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(1)
          PY
          then
            echo "❌ Invalid release version: $TAG_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "📌 Release version: $TAG_VERSION"

      - name: Validate manual release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          VALIDATED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --force
          git rev-parse --verify --quiet "refs/tags/v${VALIDATED_VERSION}" >/dev/null || {
            echo "❌ Manual release requires tag v${VALIDATED_VERSION} to exist"
            exit 1
          }

      - name: Validate pyproject.toml version
        env:
          VALIDATED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PYPI_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG_VERSION="$VALIDATED_VERSION"
          if [ "$PYPI_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: pyproject.toml=$PYPI_VERSION, tag=$TAG_VERSION"
            echo "   Run: ./scripts/bump-version.sh $TAG_VERSION"
            exit 1
          fi
          echo "✅ pyproject.toml version: $PYPI_VERSION"

      - name: Validate package.json version
        env:
          VALIDATED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VSX_VERSION=$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("vscode-extension/package.json").read_text())["version"])')
          TAG_VERSION="$VALIDATED_VERSION"
          if [ "$VSX_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: package.json=$VSX_VERSION, tag=$TAG_VERSION"
            echo "   Run: ./scripts/bump-version.sh $TAG_VERSION"
            exit 1
          fi
          echo "✅ package.json version: $VSX_VERSION"

      - name: Validate every release-facing version surface
        run: uv run --frozen pytest tests/test_release_hardening.py -q

  smoke-cross-platform:
    name: "Cross-Platform Smoke (${{ matrix.label }})"
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-latest
          - os: windows-latest
            label: windows-latest
          - os: macos-14
            label: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependencies
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Verify integration helper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/setup-integrations.sh
          ./scripts/start-drawio.sh

      - name: Verify integration helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup-integrations.ps1
          ./scripts/start-drawio.ps1

      - name: Run Python and MCP smoke tests
        shell: bash
        run: uv run pytest tests/test_export_pipeline.py tests/test_figure_embedding.py tests/test_config_paths.py tests/test_copilot_hook_guard.py tests/test_mcp_integration.py -q

      - name: Smoke pinned watermark-removal package offline
        shell: bash
        run: >-
          uv run pytest tests/integration/test_watermark_package_smoke.py -q
          -m "integration"

      - name: Verify MCP server boots directly
        run: uv run python scripts/verify_mcp_server_boot.py

      - name: Run VS Code extension smoke tests
        working-directory: vscode-extension
        run: npm test -- --run src/test/uvManager.test.ts src/test/packaging.test.ts src/test/extensionHelpers.test.ts

  # ──────────────────────────────────────────────────────
  # 2. Run tests before publishing
  # ──────────────────────────────────────────────────────
  test-python:
    name: Test Python release surface
    runs-on: ubuntu-latest
    needs: [validate, smoke-cross-platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Validate tool-surface authority
        run: uv run python scripts/check_tool_surface_authority.py

      - name: Enforce code-quality debt ratchet
        run: uv run python scripts/check_code_quality_authority.py

      - name: Run tests
        run: uv run pytest tests/ -x -q --timeout=60 -m "not integration and not slow"

      - name: Smoke production compact tool surface
        run: uv run python scripts/greedy_mcp_tool_smoke.py --surface compact --stop-on error --json

      - name: Smoke full diagnostic tool surface
        run: uv run python scripts/greedy_mcp_tool_smoke.py --surface full --stop-on error --json

  lint-security:
    name: Lint and security gates
    runs-on: ubuntu-latest
    needs: [validate, smoke-cross-platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Lint Python
        run: uv run ruff check src/ tests/

      - name: Check Python formatting
        run: uv run ruff format --check src/ tests/

      - name: Type check Python
        run: uv run mypy src/ --ignore-missing-imports

      - name: Security scan
        run: uv run bandit -c pyproject.toml -r src/

      - name: Detect high-confidence orphan code
        run: uv run vulture src/ --min-confidence 80

      - name: Audit extension dependencies
        working-directory: vscode-extension
        run: npm audit --omit=dev --audit-level=high

  external-mcp-sdk2-smoke:
    name: Smoke pinned external MCP SDK2 archives
    runs-on: ubuntu-latest
    needs: [validate, smoke-cross-platform]
    permissions:
      actions: read # Verify the exact release SHA already passed the canonical CI archive job.
      contents: read # Checkout the immutable release tag for a fail-closed local fallback.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Reuse successful exact-SHA CI archive gate
        id: exact-sha-ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          release_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }


          def get_json(path: str, **query: str) -> dict:
              url = (
                  f"https://api.github.com/repos/{repository}{path}?"
                  f"{urllib.parse.urlencode(query)}"
              )
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          runs = get_json(
              "/actions/runs",
              head_sha=release_sha,
              status="success",
              per_page="100",
          ).get("workflow_runs", [])
          verified_run = None
          for run in runs:
              if not (
                  run.get("name") == "CI"
                  and run.get("path") == ".github/workflows/ci.yml"
                  and run.get("event") == "push"
                  and run.get("head_branch") == "master"
                  and run.get("head_sha") == release_sha
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
              ):
                  continue
              jobs = get_json(
                  f"/actions/runs/{run['id']}/jobs",
                  filter="latest",
                  per_page="100",
              ).get("jobs", [])
              if any(
                  job.get("name") == "Pinned External MCP SDK 2 Smokes"
                  and job.get("status") == "completed"
                  and job.get("conclusion") == "success"
                  for job in jobs
              ):
                  verified_run = run
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"verified={'true' if verified_run else 'false'}\n")
          if verified_run:
              print(
                  "Reusing exact-SHA archive evidence from "
                  f"{verified_run['html_url']} ({release_sha})."
              )
          else:
              print(
                  "No successful exact-SHA CI archive gate found; "
                  "the release will execute the local fallback."
              )
          PY

      - name: Install uv
        if: steps.exact-sha-ci.outputs.verified != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Set up Python
        if: steps.exact-sha-ci.outputs.verified != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        if: steps.exact-sha-ci.outputs.verified != 'true'
        run: uv sync --frozen --all-extras

      - name: Initialize and inspect all five immutable SDK2 archives
        if: steps.exact-sha-ci.outputs.verified != 'true'
        run: >-
          uv run pytest tests/integration/test_zotero_sdk2_install_smoke.py -q
          -m "integration and slow"

  vsx-bundle-drift:
    name: Verify VSIX bundle drift
    runs-on: ubuntu-latest
    needs: [validate, smoke-cross-platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Check committed bundle drift
        working-directory: vscode-extension
        run: npm run bundle:check

  build-artifacts:
    name: Build and smoke release artifacts
    runs-on: ubuntu-24.04
    needs:
      [
        validate,
        smoke-cross-platform,
        test-python,
        lint-security,
        external-mcp-sdk2-smoke,
        vsx-bundle-drift,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Sync bundled assets for artifact build
        working-directory: vscode-extension
        run: npm run bundle:sync

      - name: Sync Python MCP sources for VSIX
        working-directory: vscode-extension
        run: npm run bundle:sync-python

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Run extension tests
        working-directory: vscode-extension
        run: npm test

      - name: Package VSIX
        working-directory: vscode-extension
        run: npm run package

      - name: Validate packaged extension
        working-directory: vscode-extension
        run: npm run validate -- --skip-tests

      - name: Build Python distribution artifacts
        run: uv build

      - name: Install and smoke-test the built wheel
        shell: bash
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          WHEEL_PATH=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL_PATH"
          uv venv --python 3.12 "$RUNNER_TEMP/medpaper-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/medpaper-wheel-smoke/bin/python" \
            "${WHEEL_PATH}[provenance,watermark]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/medpaper-wheel-smoke/bin/python" - <<'PY'
          import asyncio
          import hashlib
          import os
          from importlib.metadata import version
          from pathlib import Path

          import med_paper_assistant
          import numpy as np
          from PIL import Image
          from med_paper_assistant.domain.value_objects.content_integrity import (
              REMOVAL_PACKAGE_REQUIRED_CHECKS,
              RemovalPackageStatus,
          )
          from med_paper_assistant.infrastructure.external.content_integrity import (
              RemoveAiWatermarksInspectionAdapter,
          )
          from med_paper_assistant.interfaces.mcp.server import create_server
          from med_paper_assistant.shared.template_paths import get_templates_dir

          assert med_paper_assistant.__version__ == os.environ["EXPECTED_RELEASE_VERSION"]
          assert version("c2pa-python") == "0.37.7"
          assert version("remove-ai-watermarks") == "0.26.3"
          assert (get_templates_dir() / "journal-profile.template.yaml").is_file()

          asset = Path("wheel-watermark-negative.png")
          pixels = np.random.default_rng(0).integers(0, 255, (512, 512, 3), dtype=np.uint8)
          Image.fromarray(pixels).save(asset)
          before = hashlib.sha256(asset.read_bytes()).hexdigest()
          package_check = RemoveAiWatermarksInspectionAdapter().inspect(asset, "image/png")
          assert package_check.status is RemovalPackageStatus.NOT_DETECTED
          assert package_check.checks_completed == REMOVAL_PACKAGE_REQUIRED_CHECKS
          assert package_check.derivative_written is False
          assert hashlib.sha256(asset.read_bytes()).hexdigest() == before

          async def smoke() -> None:
              server = create_server("compact")
              assert len(await server.list_tools()) == 12
              assert len(await server.list_prompts()) == 3
              assert len(await server.list_resources()) == 3

          asyncio.run(smoke())
          PY

      - name: Download VS Code CLI for isolated install smoke
        shell: bash
        run: |
          VSCODE_VERSION=1.101.2
          VSCODE_SHA256=ef62ab0835017bec498e7498fe79eb347f7610fe2da7bd71d5f69d8743ded033
          curl -fsSL "https://update.code.visualstudio.com/${VSCODE_VERSION}/linux-x64/stable" \
            -o "$RUNNER_TEMP/vscode-linux.tar.gz"
          echo "$VSCODE_SHA256  $RUNNER_TEMP/vscode-linux.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vscode-linux"
          tar -xzf "$RUNNER_TEMP/vscode-linux.tar.gz" \
            -C "$RUNNER_TEMP/vscode-linux" --strip-components=1
          echo "VSCODE_CLI=$RUNNER_TEMP/vscode-linux/bin/code" >> "$GITHUB_ENV"

      - name: Install pinned VS Code CLI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2t64 libgbm1

      - name: Install VSIX into an isolated VS Code profile
        working-directory: vscode-extension
        run: npm run test:install-smoke

      - name: Upload Python dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medpaper-python-dist-${{ needs.validate.outputs.version }}
          path: dist/*

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medpaper-assistant-${{ needs.validate.outputs.version }}.vsix
          path: vscode-extension/*.vsix

  # ──────────────────────────────────────────────────────
  # 3. Publish to PyPI (Trusted Publishing)
  # ──────────────────────────────────────────────────────
  publish-pypi:
    name: Publish Python distributions
    runs-on: ubuntu-latest
    needs: [validate, build-artifacts, lint-security]
    environment: pypi
    permissions:
      id-token: write # Required for trusted publishing
    steps:
      - name: Download Python dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: medpaper-python-dist-${{ needs.validate.outputs.version }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
        # Uses trusted publishing - no API token needed!
        # Configure at: https://pypi.org/manage/project/med-paper-assistant/settings/publishing/

  # ──────────────────────────────────────────────────────
  # 4. Publish to VS Code Marketplace
  # ──────────────────────────────────────────────────────
  publish-vsx:
    name: Publish VS Marketplace artifact
    runs-on: ubuntu-latest
    needs: [validate, build-artifacts, publish-pypi, lint-security]
    permissions:
      contents: read
      id-token: write # Required for the VS Marketplace OIDC exchange.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: medpaper-assistant-${{ needs.validate.outputs.version }}.vsix
          path: release-assets

      - name: Smoke the published runtime and watermark extras
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/medpaper-pypi-smoke"
          uv pip install --python "$RUNNER_TEMP/medpaper-pypi-smoke/bin/python" \
            "med-paper-assistant[provenance,watermark]==$RELEASE_VERSION"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/medpaper-pypi-smoke/bin/python" - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import numpy as np
          from PIL import Image
          from med_paper_assistant.domain.value_objects.content_integrity import (
              REMOVAL_PACKAGE_REQUIRED_CHECKS,
          )
          from med_paper_assistant.infrastructure.external.content_integrity import (
              RemoveAiWatermarksInspectionAdapter,
          )

          assert version("c2pa-python") == "0.37.7"
          assert version("remove-ai-watermarks") == "0.26.3"
          asset = Path("pypi-watermark-negative.png")
          pixels = np.random.default_rng(0).integers(0, 255, (512, 512, 3), dtype=np.uint8)
          Image.fromarray(pixels).save(asset)
          result = RemoveAiWatermarksInspectionAdapter().inspect(asset, "image/png")
          assert result.checks_completed == REMOVAL_PACKAGE_REQUIRED_CHECKS
          assert result.derivative_written is False
          PY

      # OIDC landed upstream after the latest stable npm release. Pin the
      # audited upstream dependency-hardening commit until it ships as stable.
      - name: Check out OIDC-capable VSCE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vscode-vsce
          ref: 70891918a07c4ccfe2f2d081ab2aeeab3cf304bc
          path: .release-tools/vscode-vsce
          persist-credentials: false

      - name: Build pinned VSCE publisher
        working-directory: .release-tools/vscode-vsce
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run compile

      - name: Publish to VS Marketplace with OIDC
        working-directory: vscode-extension
        run: |
          VSIX_PATH=$(find ../release-assets -name '*.vsix' -print -quit)
          node ../.release-tools/vscode-vsce/vsce publish --oidc --packagePath "$VSIX_PATH"

  # ──────────────────────────────────────────────────────
  # 5. Create GitHub Release
  # ──────────────────────────────────────────────────────
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-artifacts, publish-pypi, publish-vsx, lint-security]
    if: >-
      ${{ always()
          && needs.validate.result == 'success'
          && needs.build-artifacts.result == 'success'
          && needs.publish-pypi.result == 'success'
          && needs.lint-security.result == 'success' }}
    permissions:
      contents: write # Required to create the release and upload its assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: medpaper-assistant-${{ needs.validate.outputs.version }}.vsix
          path: release-assets

      - name: Download Python dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: medpaper-python-dist-${{ needs.validate.outputs.version }}
          path: release-assets

      # Keep the audited action for its atomic notes + multi-asset upload behavior.
      - name: Create GitHub Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: "release-assets/*"
          body: |
            ## 📦 Installation

            ### PyPI
            ```bash
            pip install med-paper-assistant==${{ needs.validate.outputs.version }}
            ```

            ### VS Code / VS Marketplace
            Marketplace publish job status: `${{ needs.publish-vsx.result }}`.

            If the status is `success`, search "MedPaper Assistant" in VS Code Extensions or run:
            ```bash
            code --install-extension u9401066.medpaper-assistant
            ```

            If the Marketplace status is not `success`, install the attached
            `medpaper-assistant-${{ needs.validate.outputs.version }}.vsix` manually.
