name: CI

# Tiering (docs/wiki/development-and-release.md "CI tiers"):
#   local pre-commit/pre-push run the same locked commands first (.pre-commit-config.yaml);
#   this workflow re-checks only the areas a change touches; the weekly schedule and
#   workflow_dispatch run everything; release.yml re-runs its own full gate per tag.
# Required checks stay stable job names gated by job-level `if:` (a skipped job reports
# success). Every gate is fail-open: if `changes` fails, its outputs are empty and
# `!= 'false'` / `!= '[]'` select the job.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1" # Weekly full matrix catches runner-image and upstream drift
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same branch and trigger
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "Detect Changed Areas"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.areas.outputs.python }}
      vsx: ${{ steps.areas.outputs.vsx }}
      dashboard: ${{ steps.areas.outputs.dashboard }}
      markdown: ${{ steps.areas.outputs.markdown }}
      sdk2: ${{ steps.areas.outputs.sdk2 }}
      smoke_os: ${{ steps.areas.outputs.smoke_os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_changed_areas.py
          sparse-checkout-cone-mode: false

      - name: Classify changed paths (fail-open)
        id: areas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changed_areas.py --github-output "$GITHUB_OUTPUT"

  cross-platform-smoke:
    name: "Cross-Platform Smoke (${{ matrix.os }})"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.smoke_os != '[]' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.smoke_os || '["ubuntu-latest","windows-latest","macos-14"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Verify integration helper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/setup-integrations.sh
          ./scripts/start-drawio.sh

      - name: Verify integration helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup-integrations.ps1
          ./scripts/start-drawio.ps1

      - name: Run Python and MCP smoke tests
        shell: bash
        run: uv run pytest tests/test_export_pipeline.py tests/test_figure_embedding.py tests/test_config_paths.py tests/test_copilot_hook_guard.py tests/test_mcp_integration.py -q

      - name: Smoke pinned watermark-removal package offline
        shell: bash
        run: >-
          uv run pytest tests/integration/test_watermark_package_smoke.py -q
          -m "integration"

      - name: Verify MCP server boots directly
        run: uv run python scripts/verify_mcp_server_boot.py

      - name: Run VS Code extension smoke tests
        working-directory: vscode-extension
        run: npm test -- --run src/test/uvManager.test.ts src/test/packaging.test.ts src/test/extensionHelpers.test.ts src/test/workflows.test.ts

  # ──────────────────────────────────────────────────────
  # Python: lint, type check, security, tests
  # ──────────────────────────────────────────────────────
  python-lint:
    name: "Python Lint & Security"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Validate tool-surface authority
        run: uv run python scripts/check_tool_surface_authority.py

      - name: Validate generated Agent Plugin
        run: uv run python scripts/build_agent_plugin.py --check

      - name: Validate vendored companion skills
        run: uv run python scripts/sync_companion_skills.py --check

      - name: Enforce code-quality debt ratchet
        run: uv run python scripts/check_code_quality_authority.py

      - name: Check code/docs/test structural consistency
        run: uv run python scripts/check_consistency.py

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r src/

      - name: Detect high-confidence orphan code
        run: uv run vulture src/ --min-confidence 80

  python-test:
    name: "Python Tests"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest tests/ -x -q --timeout=60 -m "not integration and not slow"

      - name: Verify MCP server boots
        run: uv run python scripts/verify_mcp_server_boot.py

      - name: Smoke production compact tool surface
        run: uv run python scripts/greedy_mcp_tool_smoke.py --surface compact --stop-on error --json

      - name: Smoke full diagnostic tool surface
        run: uv run python scripts/greedy_mcp_tool_smoke.py --surface full --stop-on error --json

  external-mcp-sdk2-smoke:
    name: "Pinned External MCP SDK 2 Smokes"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sdk2 != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: uv sync --frozen --all-extras

      - name: Initialize and inspect all five immutable SDK2 archives
        run: >-
          uv run pytest tests/integration/test_zotero_sdk2_install_smoke.py -q
          -m "integration and slow"

  # ──────────────────────────────────────────────────────
  # VS Code Extension: compile, test
  # ──────────────────────────────────────────────────────
  vsx:
    name: "VS Code Extension"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.vsx != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Check committed bundle drift
        working-directory: vscode-extension
        run: npm run bundle:check

      - name: Sync bundled assets for build-time validation
        working-directory: vscode-extension
        run: npm run bundle:sync

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Run extension validate
        working-directory: vscode-extension
        run: npm run validate

  # ──────────────────────────────────────────────────────
  # Dashboard: build check
  # ──────────────────────────────────────────────────────
  dashboard:
    name: "Dashboard Build"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dashboard != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build
        working-directory: dashboard
        run: npm run build

  # ──────────────────────────────────────────────────────
  # Markdown: prettier format check
  # ──────────────────────────────────────────────────────
  markdown:
    name: "Markdown Format"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.markdown != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check markdown formatting
        run: npx prettier@3.1.0 --check --prose-wrap preserve "**/*.md" "!integrations/**" "!node_modules/**" "!.venv/**" "!projects/**"
